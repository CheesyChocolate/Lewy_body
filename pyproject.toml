[project]
name = "Lewy_body"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "adjusttext>=1.4.0",
    "click>=8.1.0",
    "matplotlib>=3.9.4",
    "numpy>=1.26.4,<2",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
    "dcm2niix>=1.0.20260724",
    "nibabel>=5.3.3",
    "SimpleITK>=2.5.6",
    "antspyx>=0.6.3",
    "pyradiomics>=3.1.0",
    "antspynet>=0.3.2",
    "tensorflow[and-cuda]==2.20.0",
    "imbalanced-learn>=0.12.4",
    "pydicom>=2.4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
